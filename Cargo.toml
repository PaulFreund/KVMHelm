[package]
name = "kvmhelm"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
path = "native/src/lib.rs"

[features]
embedded-web = []

[[bin]]
name = "kvmhelm"
path = "native/src/main.rs"
required-features = ["embedded-web"]

[[test]]
name = "foundation"
path = "native/tests/foundation.rs"

[[test]]
name = "legacy_compat"
path = "native/tests/legacy_compat.rs"

[[test]]
name = "core_media"
path = "native/tests/core_media.rs"

[[test]]
name = "network_drivers"
path = "native/tests/network_drivers.rs"

[[test]]
name = "http_api"
path = "native/tests/http_api.rs"

[[test]]
name = "audio_http"
path = "native/tests/audio_http.rs"

[dependencies]
aes-gcm = "=0.10.3"
async-trait = "=0.1.92"
base64 = "=0.22.1"
bytes = "=1.12.1"
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "async-await", "sink"] }
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
if-addrs = "=0.15.0"
indexmap = "=2.14.2"
png = "=0.18.1"
opus = "=0.4.0"
rand = "=0.8.8"
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "=2.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
subtle = "=2.6.1"
sse-stream = "=0.2.6"
str0m = { version = "=0.24.1", default-features = false, features = ["aws-lc-rs"] }
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "signal", "io-std", "process"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
url = "=2.5.8"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
webpki-roots = "=1.0.11"
x509-parser = "=0.18.1"
zeroize = "=1.9.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_JobObjects"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
rcgen = "=0.14.10"
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
