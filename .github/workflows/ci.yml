name: Build and regression checks
on: [push, pull_request]
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --features embedded-web -- -D warnings
      - run: cargo test --locked --features embedded-web
      - run: cargo test --locked --test legacy_compat -- --ignored
      - run: cargo build --locked --features embedded-web
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: node scripts/ui-layout.mjs
      - name: Native executable with embedded Vue assets
        shell: bash
        run: KVMHELM_TEST_BINARY="target/debug/kvmhelm${{ runner.os == 'Windows' && '.exe' || '' }}" node scripts/ui-layout.mjs
      - name: Native MCP HTTP and stdio interop and recovery
        shell: bash
        run: KVMHELM_TEST_BINARY="target/debug/kvmhelm${{ runner.os == 'Windows' && '.exe' || '' }}" node scripts/native-mcp-interop.mjs
      - name: Native stdio bridge against reference TypeScript daemon
        shell: bash
        run: KVMHELM_TEST_DAEMON=typescript KVMHELM_TEST_BINARY="target/debug/kvmhelm${{ runner.os == 'Windows' && '.exe' || '' }}" node scripts/native-mcp-interop.mjs
      - name: Native JetKVM with an actual local WebRTC peer
        shell: bash
        run: KVMHELM_TEST_BINARY="target/debug/kvmhelm${{ runner.os == 'Windows' && '.exe' || '' }}" node scripts/native-jetkvm-interop.mjs
      - name: Native Janus audio and existing Vue microphone lifecycle
        shell: bash
        run: KVMHELM_TEST_BINARY="target/debug/kvmhelm${{ runner.os == 'Windows' && '.exe' || '' }}" node scripts/native-audio-interop.mjs
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kvmhelm:poc .
