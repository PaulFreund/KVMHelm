name: Build and regression checks
on: [push, pull_request]
jobs:
  native:
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pinned pre-port reference is prepared only for tests
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:web
      - run: npm run prepare:reference
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --features embedded-web -- -D warnings
      - run: cargo test --locked --features embedded-web
      - run: cargo test --locked --test legacy_compat -- --ignored
      - run: cargo build --locked --features embedded-web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:reference
      - name: Original layout acceptance against the isolated reference
        shell: bash
        run: KVMHELM_TEST_DAEMON=typescript node scripts/ui-layout.mjs
      - name: Native executable with embedded Vue assets
        shell: bash
        run: KVMHELM_TEST_BINARY="target/debug/kvmhelm${{ runner.os == 'Windows' && '.exe' || '' }}" node scripts/ui-layout.mjs
      - name: Native MCP HTTP and stdio interop and recovery
        shell: bash
        run: KVMHELM_TEST_BINARY="target/debug/kvmhelm${{ runner.os == 'Windows' && '.exe' || '' }}" node scripts/native-mcp-interop.mjs
      - name: Native stdio bridge against reference TypeScript daemon
        shell: bash
        run: KVMHELM_TEST_DAEMON=typescript KVMHELM_TEST_BINARY="target/debug/kvmhelm${{ runner.os == 'Windows' && '.exe' || '' }}" node scripts/native-mcp-interop.mjs
      - name: Native JetKVM with an actual local WebRTC peer
        shell: bash
        run: KVMHELM_TEST_BINARY="target/debug/kvmhelm${{ runner.os == 'Windows' && '.exe' || '' }}" node scripts/native-jetkvm-interop.mjs
      - name: Native Janus audio and existing Vue microphone lifecycle
        shell: bash
        run: KVMHELM_TEST_AUDIO_PLUGIN=1 KVMHELM_TEST_BINARY="target/debug/kvmhelm${{ runner.os == 'Windows' && '.exe' || '' }}" node scripts/native-audio-interop.mjs
      - name: Native plugin IPC, lifecycle and existing Vue panels
        shell: bash
        run: KVMHELM_TEST_BINARY="target/debug/kvmhelm${{ runner.os == 'Windows' && '.exe' || '' }}" node scripts/native-plugin-interop.mjs
      - name: Native Vue administration, input, journal recovery and touch
        shell: bash
        run: KVMHELM_TEST_BINARY="target/debug/kvmhelm${{ runner.os == 'Windows' && '.exe' || '' }}" node scripts/native-ui-interop.mjs
      - name: Same Vue acceptance against reference TypeScript daemon
        shell: bash
        run: KVMHELM_TEST_DAEMON=typescript node scripts/native-ui-interop.mjs
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build --build-arg SOURCE_REVISION=${{ github.sha }} --build-arg SOURCE_DATE_EPOCH=0 -t kvmhelm:native .
      - name: Native container readiness, SIGTERM, persistent state and restart
        shell: bash
        run: |
          set -eu
          docker volume create kvmhelm-ci-data
          docker volume create kvmhelm-ci-secrets
          docker run --rm --user 0:0 --entrypoint /bin/sh -v kvmhelm-ci-data:/data -v kvmhelm-ci-secrets:/secrets kvmhelm:native -c 'chown 1000:1000 /data /secrets'
          for cycle in 1 2; do
            docker run -d --name kvmhelm-ci --network none --read-only --tmpfs /tmp:size=32m -v kvmhelm-ci-data:/data -v kvmhelm-ci-secrets:/secrets kvmhelm:native
            ready=false
            for attempt in $(seq 1 45); do
              if docker exec kvmhelm-ci /app/kvmhelm healthcheck; then ready=true; break; fi
              sleep 1
            done
            test "$ready" = true
            docker exec kvmhelm-ci /app/node --version
            docker exec kvmhelm-ci /app/ffmpeg -version
            docker exec kvmhelm-ci test ! -e /app/dist/server/cli.js
            docker stop --time 90 kvmhelm-ci
            test "$(docker inspect --format '{{.State.ExitCode}}' kvmhelm-ci)" = 0
            docker rm kvmhelm-ci
          done
          docker volume rm kvmhelm-ci-data kvmhelm-ci-secrets
