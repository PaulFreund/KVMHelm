services:
  kvmhelm:
    build: .
    read_only: true
    user: "1000:1000"
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./runtime/data:/data
      - ./runtime/secrets:/secrets
      - ./runtime/tls:/tls:ro
    tmpfs:
      - /tmp:size=32m
    command:
      [
        "serve",
        "--host",
        "0.0.0.0",
        "--cert",
        "/tls/server.crt",
        "--key",
        "/tls/server.key",
        "--origin",
        "https://localhost:8765",
        "--origin",
        "https://127.0.0.1:8765",
      ]
    healthcheck:
      test: ["CMD", "node", "dist/server/healthcheck.js"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped
